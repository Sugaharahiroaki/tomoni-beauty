# /etc/nginx/sites-available/tomoni  → sites-enabled にシンボリックリンク
# TLS は certbot --nginx で付与する想定（server_name を実ドメインに変更）
server {
    listen 80;
    server_name app.example.com;

    client_max_body_size 220M;  # 動画素材のアップロード（200MBまで）

    location /static/ {
        alias /srv/tomoni-beauty/staticfiles/;
        expires 30d;
        access_log off;
    }

    # /media/ は Django が「見てよい人か」を確かめてから、ここに X-Accel-Redirect で送り出す
    location /protected-media/ {
        internal;
        alias /srv/tomoni-beauty/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}
